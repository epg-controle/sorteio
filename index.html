<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta do sorteio</title>
<style>
/* VOICE: oficial e calmo, como um edital afixado no mural da escola
   IDEA: a folha de resultado conferida no celular, com o código da lista no rodapé
   PICTURE: a própria lista, grande e legível, com busca por nome
   COLOUR: branco, tinta escura, uma faixa na cor da escola (vem no QR)
   TYPE: Inter para tudo, números tabulares; LAYOUT: uma coluna, cabeçalho em faixa colorida */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1420);--ink:light-dark(#141a2b,#eef1f7);--mute:light-dark(#5b6275,#a3abc0);--line:light-dark(#e3e6ee,#273046);--soft:light-dark(#f4f6fa,#161d2d);--brand:#1e3a8a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
header{background:var(--brand);color:#fff;padding:22px max(5vw,18px) 20px}
header .kick{font-size:13px;opacity:.85;margin:0 0 6px}
header h1{font-size:clamp(24px,6vw,36px);line-height:1.1;margin:0;text-wrap:balance}
header .sub{margin:8px 0 0;font-size:14.5px;opacity:.9}
main{max-width:760px;margin:0 auto;padding:18px max(5vw,16px) 28px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.pill{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.pill b{font-variant-numeric:tabular-nums;letter-spacing:.03em}
.search{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:0 0 12px}
.search:focus{outline:2px solid var(--brand);outline-offset:1px}
ol.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ol.list li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;padding:12px 4px;border-bottom:1px solid var(--line)}
ol.list .n{font:500 13px ui-monospace,Menlo,Consolas,monospace;color:var(--mute);white-space:nowrap}
ol.list .nm{font-weight:650;font-size:17px}
ol.list .s{font-size:14px;color:var(--mute);white-space:nowrap}
ol.list li.win .nm::after{content:" · sorteado";font-weight:500;font-size:13px;color:#a16207}
.empty{color:var(--mute);padding:18px 4px}
.school{margin:0 0 18px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.school h2{margin:0;font-size:18px;padding:12px 16px;background:var(--soft);border-bottom:1px solid var(--line)}
.seg{padding:12px 16px;border-bottom:1px solid var(--line)}.seg:last-child{border-bottom:0}
.seg .sl{font-size:13px;color:var(--mute);margin:0 0 2px}
.seg .w{font-size:20px;font-weight:700;margin:0}
.seg .wd{font-size:13.5px;color:var(--mute);margin:2px 0 0;font-variant-numeric:tabular-nums}
.seg .pend{color:var(--mute);font-weight:500;font-size:17px}
.seg .sup{font-size:14px;margin:8px 0 0;color:var(--ink)}
.seg .sup span{color:var(--mute)}
footer{max-width:760px;margin:0 auto;padding:0 max(5vw,16px) 30px;font-size:13px;color:var(--mute)}
.wait{max-width:520px;margin:12vh auto;padding:0 22px;text-align:center}
.wait h1{font-size:26px;margin:0 0 10px}.wait p{color:var(--mute);margin:0}
</style>
</head>
<body>
<div id="app"><div class="wait"><h1>Consulta do sorteio</h1><p>Carregando…</p></div></div>
<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const B32='abcdefghijklmnopqrstuvwxyz234567';
function b32dec(s){const out=[];let bits=0,v=0;for(const c of s){const i=B32.indexOf(c);if(i<0)continue;v=(v<<5)|i;bits+=5;if(bits>=8){bits-=8;out.push((v>>bits)&255)}}return new Uint8Array(out)}
async function decode(h){
 const kind=h[0],body=h.slice(1),bytes=b32dec(body);
 let txt;
 if(kind==='z'){const ds=new DecompressionStream('deflate-raw');const st=new Blob([bytes]).stream().pipeThrough(ds);txt=await new Response(st).text()}
 else txt=new TextDecoder().decode(bytes);
 return JSON.parse(txt)}
function waitView(msg){$('app').innerHTML=`<div class="wait"><h1>Consulta do sorteio</h1><p>${msg}</p></div>`}
function head(kick,title,sub){return `<header><p class="kick">${esc(kick)}</p><h1>${esc(title)}</h1>${sub?`<p class="sub">${esc(sub)}</p>`:''}</header>`}
function foot(d){return `<footer>Nomes abreviados, conforme a LGPD. Confira o código de verificação na lista pública e na ata do sorteio.${d.at?' Informação gerada em '+esc(d.at)+'.':''}</footer>`}
function listView(d){
 const rows=(d.r||[]).map((r,i)=>({n:(d.pf||'')+String(i+1).padStart(3,'0'),nm:r[0],s:r[1]||'',w:(d.w||[]).includes(i)}));
 document.title=`${d.e} · ${d.g} — concorrentes`;
 $('app').innerHTML=head('Lista oficial de participantes',`${d.e} · ${d.g}`,d.ti)+
  `<main><div class="meta"><span class="pill">${rows.length} concorrente${rows.length===1?'':'s'} · 1 kit</span><span class="pill">Lista ${d.lk?'lacrada':'não lacrada'} · código <b>${esc(d.c)}</b></span>${d.dt?`<span class="pill">Sorteio em ${esc(d.dt)}</span>`:''}</div>
  <input class="search" id="q" type="search" placeholder="Procurar pelo nome ou número" aria-label="Procurar na lista" autocomplete="off">
  <ol class="list" id="ls"></ol></main>`+foot(d);
 const draw=q=>{const t=q.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');const f=rows.filter(r=>!t||(r.nm+' '+r.n).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(t));
  $('ls').innerHTML=f.length?f.map(r=>`<li class="${r.w?'win':''}"><span class="n">${esc(r.n)}</span><span class="nm">${esc(r.nm)}</span><span class="s">${esc(r.s)}</span></li>`).join(''):'<li class="empty">Nenhum nome encontrado.</li>'};
 draw('');$('q').addEventListener('input',e=>draw(e.target.value))}
function winView(d){
 document.title='Ganhadores do sorteio';
 $('app').innerHTML=head(d.done?'Resultado oficial':'Resultado parcial','Ganhadores do sorteio',d.ti)+
  `<main><div class="meta"><span class="pill">Lista ${d.lk?'lacrada':'não lacrada'} · código <b>${esc(d.c)}</b></span>${d.dt?`<span class="pill">Sorteio em ${esc(d.dt)}</span>`:''}</div>
  ${(d.s||[]).map(([sc,segs])=>`<section class="school"><h2>${esc(sc)}</h2>${segs.map(([g,num,nm,se,sup])=>`<div class="seg"><p class="sl">${esc(g)}</p>${nm?`<p class="w">${esc(nm)}</p><p class="wd">${esc(num||'')}${se?' · '+esc(se):''}</p>`:'<p class="w pend">A sortear</p>'}${sup&&sup.length?`<p class="sup"><span>Suplente${sup.length>1?'s':''}:</span> ${sup.map(([o,n2,nu])=>`${o}º ${esc(n2)} (${esc(nu||'—')})`).join('; ')}</p>`:''}</div>`).join('')}</section>`).join('')}</main>`+foot(d)}
async function route(){
 const h=decodeURIComponent((location.hash||'').slice(1));
 if(!h){waitView('Escaneie o QR Code exibido no telão do sorteio para ver aqui a lista de concorrentes ou o resultado.');return}
 try{const d=await decode(h);if(d.cl&&/^#[0-9a-f]{6}$/i.test(d.cl))document.documentElement.style.setProperty('--brand',d.cl);
  if(d.t==='L')listView(d);else if(d.t==='W')winView(d);else throw new Error('tipo')}
 catch(e){waitView('Não foi possível ler este QR Code. Escaneie de novo o código exibido no telão.')}}
addEventListener('hashchange',route);route();
}
</script>
</body>
</html>
